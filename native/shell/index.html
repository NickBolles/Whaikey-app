<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Whaikey</title>
    <!--
      Bundled fallback screen (docs/NATIVE_APP.md §2.2). Capacitor loads this from
      inside the app binary whenever the deployed web app is unreachable, so it must
      stay entirely self-contained: no network fonts, no external CSS, no build step.
      Design tokens are copied from src/app/globals.css rather than imported.
    -->
    <style>
      :root {
        --background: #14100b;
        --surface: #1f1912;
        --surface-raised: #2a2117;
        --border: #392e20;
        --foreground: #f4ecdd;
        --muted: #a3927a;
        --accent: #e8a13c;
        --accent-deep: #b96f1e;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        background:
          radial-gradient(120% 60% at 50% -10%, rgba(232, 161, 60, 0.07), transparent 60%),
          var(--background);
        color: var(--foreground);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(env(safe-area-inset-top) + 1.5rem) 1.5rem
          calc(env(safe-area-inset-bottom) + 1.5rem);
        min-height: 100dvh;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.75rem;
        text-align: center;
        max-width: 22rem;
      }
      .mark {
        font-size: 3.5rem;
        line-height: 1;
        filter: drop-shadow(0 0 24px rgba(232, 161, 60, 0.25));
      }
      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.75rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0 0 0.75rem;
      }
      p {
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.6;
        margin: 0;
      }
      button {
        font: inherit;
        font-size: 0.95rem;
        font-weight: 500;
        color: #241a0c;
        background: linear-gradient(180deg, var(--accent), var(--accent-deep));
        border: 0;
        border-radius: 0.75rem;
        padding: 0.9rem 2.5rem;
        min-height: 44px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
      }
      .note {
        font-size: 0.8rem;
        color: rgba(163, 146, 122, 0.7);
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.78rem;
        color: var(--accent);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 0.4rem;
        padding: 0.15rem 0.4rem;
      }
      @media (prefers-reduced-motion: no-preference) {
        button {
          transition: filter 180ms ease;
        }
        button:active {
          filter: brightness(1.1);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">🥃</div>
      <div>
        <h1 id="title">Can't reach the bar</h1>
        <p id="message">
          Whaikey needs a connection to load your shelf. Your pours are safe — nothing is lost.
        </p>
      </div>
      <button id="retry" type="button">Try again</button>
      <p class="note" id="note" hidden></p>
    </main>

    <!-- Written by scripts/native-sync.mjs at build time; absent in a dev checkout. -->
    <script src="./config.js"></script>
    <script>
      (function () {
        var serverUrl = window.__WHAIKEY_SERVER_URL__ || "";
        var retry = document.getElementById("retry");
        var note = document.getElementById("note");

        // The splash screen is configured with launchAutoHide, but hide it eagerly
        // so a user with no signal sees this screen instead of a stalled splash.
        var splash =
          window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SplashScreen;
        if (splash && typeof splash.hide === "function") splash.hide();

        if (!serverUrl) {
          document.getElementById("title").textContent = "No server configured";
          document.getElementById("message").textContent =
            "This build has no app URL baked in, so there is nothing to load.";
          note.innerHTML =
            "Set <code>CAP_SERVER_URL</code> and re-run <code>pnpm native:sync</code>.";
          note.hidden = false;
          retry.disabled = true;
          return;
        }

        function reconnect() {
          retry.disabled = true;
          retry.textContent = "Connecting…";
          window.location.replace(serverUrl);
        }

        retry.addEventListener("click", reconnect);
        // Coming back into signal is the common case — don't make them tap.
        window.addEventListener("online", reconnect);
      })();
    </script>
  </body>
</html>
