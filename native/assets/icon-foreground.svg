<!--
  Android adaptive-icon foreground layer. Transparent background (the launcher
  composites it over @color/ic_launcher_background), and the glass is scaled to
  sit inside the centre ~62% of the canvas — outside that, OEM masks crop it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 432" width="432" height="432">
  <defs>
    <linearGradient id="whiskey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8a13c" />
      <stop offset="55%" stop-color="#c9791f" />
      <stop offset="100%" stop-color="#8f4d13" />
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4ecdd" stop-opacity="0.34" />
      <stop offset="45%" stop-color="#f4ecdd" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#f4ecdd" stop-opacity="0.24" />
    </linearGradient>
  </defs>

  <g transform="translate(216 212) scale(0.6)">
    <path
      d="M -168 -36 L 168 -36 L 141 196 a 34 34 0 0 1 -34 30 L -107 226 a 34 34 0 0 1 -34 -30 Z"
      fill="url(#whiskey)"
    />
    <ellipse cx="0" cy="-36" rx="168" ry="26" fill="#f2b45c" opacity="0.5" />
    <path
      d="M -196 -212 L 196 -212 L 141 196 a 34 34 0 0 1 -34 30 L -107 226 a 34 34 0 0 1 -34 -30 Z"
      fill="url(#glass)"
      stroke="#f4ecdd"
      stroke-opacity="0.5"
      stroke-width="14"
      stroke-linejoin="round"
    />
    <ellipse
      cx="0"
      cy="-212"
      rx="196"
      ry="30"
      fill="none"
      stroke="#f4ecdd"
      stroke-opacity="0.62"
      stroke-width="14"
    />
    <path d="M -150 -176 L -118 -176 L -76 170 L -104 170 Z" fill="#f4ecdd" opacity="0.16" />
  </g>
</svg>
