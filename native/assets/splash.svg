<!--
  Source art for generated splash screens (docs/APP_STORE_SETUP.md §11).
  Square and heavily cropped across device aspect ratios, so everything that
  matters stays inside the middle ~40%.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732" width="2732" height="2732">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="46%">
      <stop offset="0%" stop-color="#e8a13c" stop-opacity="0.16" />
      <stop offset="65%" stop-color="#e8a13c" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#e8a13c" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="whiskey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8a13c" />
      <stop offset="55%" stop-color="#c9791f" />
      <stop offset="100%" stop-color="#8f4d13" />
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4ecdd" stop-opacity="0.30" />
      <stop offset="45%" stop-color="#f4ecdd" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#f4ecdd" stop-opacity="0.20" />
    </linearGradient>
  </defs>

  <rect width="2732" height="2732" fill="#14100b" />
  <rect width="2732" height="2732" fill="url(#glow)" />

  <g transform="translate(1366 1286) scale(1.05)">
    <path
      d="M -168 -36 L 168 -36 L 141 196 a 34 34 0 0 1 -34 30 L -107 226 a 34 34 0 0 1 -34 -30 Z"
      fill="url(#whiskey)"
    />
    <ellipse cx="0" cy="-36" rx="168" ry="26" fill="#f2b45c" opacity="0.5" />
    <path
      d="M -196 -212 L 196 -212 L 141 196 a 34 34 0 0 1 -34 30 L -107 226 a 34 34 0 0 1 -34 -30 Z"
      fill="url(#glass)"
      stroke="#f4ecdd"
      stroke-opacity="0.42"
      stroke-width="14"
      stroke-linejoin="round"
    />
    <ellipse
      cx="0"
      cy="-212"
      rx="196"
      ry="30"
      fill="none"
      stroke="#f4ecdd"
      stroke-opacity="0.55"
      stroke-width="14"
    />
    <path d="M -150 -176 L -118 -176 L -76 170 L -104 170 Z" fill="#f4ecdd" opacity="0.14" />
  </g>

  <text
    x="1366"
    y="1700"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="150"
    font-weight="600"
    letter-spacing="6"
    fill="#f4ecdd"
  >
    Whaikey
  </text>
</svg>
