<!--
  Source art for every generated app icon (docs/APP_STORE_SETUP.md §11).
  Caskfolk (rebrand v2 board, brands.py icon()): the cask-head / round-table
  mark on a fir-to-rickhouse ground. Full-bleed on purpose: Apple rejects icons
  with an alpha channel or pre-rounded corners, and both platforms mask the
  square themselves. Palette matches src/app/globals.css.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c3226" />
      <stop offset="1" stop-color="#0b120e" />
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#ground)" />
  <rect x="96" y="96" width="832" height="832" rx="150" fill="none" stroke="#d27b3e" stroke-opacity=".16" stroke-width="5" />
  <g transform="translate(192 192) scale(10)"><circle cx="32" cy="32" r="14" fill="none" stroke="#eee7d6" stroke-width="3.4"/><path d="M25.5 20.3v23.4M32 18v28M38.5 20.3v23.4" stroke="#eee7d6" stroke-width="1.4" opacity=".35"/><path d="M24.8 8.6A24.5 24.5 0 0 1 39.2 8.6M48.7 14.1A24.5 24.5 0 0 1 55.9 26.5M55.9 37.5A24.5 24.5 0 0 1 48.7 49.9M39.2 55.4A24.5 24.5 0 0 1 24.8 55.4M15.3 49.9A24.5 24.5 0 0 1 8.1 37.5M8.1 26.5A24.5 24.5 0 0 1 15.3 14.1" fill="none" stroke="#d27b3e" stroke-width="5.2" stroke-linecap="round"/></g>
