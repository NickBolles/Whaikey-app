<!--
  Source art for every generated app icon (docs/APP_STORE_SETUP.md §11).
  Full-bleed on purpose: Apple rejects icons with an alpha channel or
  pre-rounded corners, and both platforms mask the square themselves.
  Palette matches src/app/globals.css.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="glow" cx="50%" cy="12%" r="72%">
      <stop offset="0%" stop-color="#e8a13c" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#e8a13c" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#e8a13c" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="whiskey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8a13c" />
      <stop offset="55%" stop-color="#c9791f" />
      <stop offset="100%" stop-color="#8f4d13" />
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4ecdd" stop-opacity="0.30" />
      <stop offset="45%" stop-color="#f4ecdd" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#f4ecdd" stop-opacity="0.20" />
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="#14100b" />
  <rect width="1024" height="1024" fill="url(#glow)" />

  <!-- Rocks glass: slightly tapered tumbler, centred with generous margin so
       the aggressive Android adaptive-icon mask never clips it. -->
  <g transform="translate(512 524) scale(1.18)">
    <!-- liquid -->
    <path
      d="M -168 -36 L 168 -36 L 141 196 a 34 34 0 0 1 -34 30 L -107 226 a 34 34 0 0 1 -34 -30 Z"
      fill="url(#whiskey)"
    />
    <!-- surface highlight on the pour -->
    <ellipse cx="0" cy="-36" rx="168" ry="26" fill="#f2b45c" opacity="0.5" />
    <!-- glass body -->
    <path
      d="M -196 -212 L 196 -212 L 141 196 a 34 34 0 0 1 -34 30 L -107 226 a 34 34 0 0 1 -34 -30 Z"
      fill="url(#glass)"
      stroke="#f4ecdd"
      stroke-opacity="0.42"
      stroke-width="14"
      stroke-linejoin="round"
    />
    <!-- rim -->
    <ellipse
      cx="0"
      cy="-212"
      rx="196"
      ry="30"
      fill="none"
      stroke="#f4ecdd"
      stroke-opacity="0.55"
      stroke-width="14"
    />
    <!-- vertical catch-light -->
    <path d="M -150 -176 L -118 -176 L -76 170 L -104 170 Z" fill="#f4ecdd" opacity="0.14" />
  </g>
</svg>
