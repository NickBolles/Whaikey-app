name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Typecheck, lint, unit tests, and a production build. Runs on the plain
  # runner (no browser needed) in parallel with the Playwright jobs below.
  unit:
    name: typecheck / lint / unit / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version is pinned by package.json's packageManager field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      # Validates capacitor.config.ts and the bundled offline shell. Needs no
      # Xcode, Android SDK, or network (docs/NATIVE_APP.md §5).
      - run: pnpm native:check
        env:
          BETTER_AUTH_SECRET: ci-secret

  # Compiles the Android project on every PR so a broken Gradle change, manifest
  # error, or plugin mismatch is caught here rather than at release time. No
  # signing material is involved — this is `assembleDebug` and nothing more.
  # iOS gets the same check but only on pushes to main, not on PRs: it needs a
  # macOS runner at roughly 10x the per-minute cost, and a broken Xcode project
  # is rare enough that catching it on merge is a fair trade.
  android-build:
    name: android (debug build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      # Bakes the server origin into the offline shell and runs `cap sync`, so the
      # build exercises the same path a release does.
      - run: pnpm native:sync
        env:
          CAP_SERVER_URL: https://app.whaikey.com
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android

  ios-build:
    name: ios (compile)
    if: github.event_name == 'push'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm native:sync
        env:
          CAP_SERVER_URL: https://app.whaikey.com
      # Unsigned simulator build: proves the project, plugins, and entitlements
      # file parse and compile without needing any certificate.
      - name: Compile
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  # Functional end-to-end smoke suite (playwright project "functional").
  # Runs inside the Playwright container so the browser + OS deps match the
  # library version pinned in package.json.
  e2e:
    name: e2e (functional)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    env:
      # The local dev container points Playwright at a preinstalled Chromium;
      # in CI we use the browser bundled with the pinned Playwright version.
      PLAYWRIGHT_CHROMIUM_PATH: ""
    steps:
      - uses: actions/checkout@v4
      # Version is pinned by package.json's packageManager field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-e2e
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Visual regression suite (projects "visual-mobile" + "visual-desktop").
  # Baselines under e2e/__screenshots__/ are CI-canonical: they must be
  # regenerated from this container (see README "Visual baselines"), never
  # from a local render, because font rasterization differs by environment.
  visual:
    name: visual regression
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    env:
      PLAYWRIGHT_CHROMIUM_PATH: ""
    steps:
      - uses: actions/checkout@v4
      # Version is pinned by package.json's packageManager field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-visual
          path: |
            playwright-report/
            test-results/
          retention-days: 7
