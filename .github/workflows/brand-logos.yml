# Brand/distillery logo backfill (docs/DATA_SOURCES.md §5.4).
#
# Runs `pnpm logos --apply` against the production database (DATABASE_URL
# secret): files every bottle under a brand, then looks up marks for brands
# never checked or checked > 30 days ago — Wikidata P154/P8972 → Wikimedia
# Commons (license + attribution from the file page) → the official site's
# icon under nominative use → none (the UI draws the monogram). Requests are
# rate limited per host (Wikimedia 1/s, brand sites 1 per 2 s) and the run is
# idempotent, so a re-run only does the remaining work.
name: brand logos

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Brands to look up this run (busiest first)"
        default: "150"
      force:
        description: "Re-check brands checked in the last 30 days"
        type: boolean
        default: false
      dry_run:
        description: "Plan and look up only; write nothing"
        type: boolean
        default: false
  schedule:
    # Tuesdays 10:00 UTC — the day after catalog sync adds new bottles.
    - cron: "0 10 * * 2"

permissions:
  contents: read

concurrency:
  group: brand-logos
  cancel-in-progress: false

jobs:
  logos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Backfill logos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LIMIT: ${{ inputs.limit || '150' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
          APPLY: ${{ inputs.dry_run && ' ' || '--apply' }}
        run: pnpm logos $APPLY --limit "$LIMIT" $FORCE --summary logo-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brand-logo-report
          path: logo-report.json
          if-no-files-found: ignore
