# Catalog population against the production database (docs/DATA_SOURCES.md §6).
#
# Runs `pnpm ingest` against the DATABASE_URL secret:
#   - iowa:   full Iowa Liquor Products sync (feed updates monthly; idempotent)
#   - oregon/utah/bc/systembolaget/whiskyedition/vinmonopolet: secondary
#             retail catalogs (docs/DATA_SOURCES.md §2.2b) — each is
#             best-effort like cola; a flaky external feed only marks the
#             run partial instead of blocking the rest
#   - cola:   TTB label approvals for the last 8 days (registry maintenance
#             can interrupt this source, and the run reports any interruption)
#   - optional API enrichment: manual opt-in only. Subscription-backed catalog
#             review lives in subscription-catalog-verification.yml.
#
# Requires repo secrets: DATABASE_URL (Postgres/Supabase pooler URL) and, for
# the enrich step, OPENROUTER_API_KEY (preferred) or ANTHROPIC_API_KEY. Without DATABASE_URL the run stops early
# with a clear message instead of failing cryptically. Optional secret
# VINMONOPOLET_API_KEY enables the Vinmonopolet source (skipped when unset).
name: catalog sync

on:
  workflow_dispatch:
    inputs:
      skip_enrich:
        description: "Skip API-key AI enrichment (subscription workflow preferred)"
        type: boolean
        default: true
      cola_scope:
        description: "TTB COLA range to import (full history is whiskey-only and can take hours)"
        type: choice
        options:
          - recent
          - full-history
        default: recent
  schedule:
    # Mondays 09:00 UTC — after Iowa's monthly refresh lands and clear of
    # TTB's Sunday maintenance window.
    - cron: "0 9 * * 1"

concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set — add the production Postgres URL to repo secrets to enable catalog sync."
            exit 1
          fi
      - uses: actions/checkout@v4
      # package.json pins pnpm@10.17.1; let the setup action use that single source of truth.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Sync Iowa Liquor Products
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm ingest iowa

      - id: oregon
        name: Sync Oregon OLCC pricing
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm ingest oregon

      - id: utah
        name: Sync Utah DABS product list
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm ingest utah

      - id: bc
        name: Sync BC Liquor price list
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm ingest bc

      - id: systembolaget
        name: Sync Systembolaget assortment mirror
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm ingest systembolaget

      - id: whiskyedition
        name: Sync WHISKY:EDITION review catalog
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm ingest whiskyedition

      - id: vinmonopolet
        name: Sync Vinmonopolet products
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VINMONOPOLET_API_KEY: ${{ secrets.VINMONOPOLET_API_KEY }}
        run: |
          if [ -z "$VINMONOPOLET_API_KEY" ]; then
            echo "VINMONOPOLET_API_KEY secret is not set — skipping the Vinmonopolet source."
            exit 0
          fi
          pnpm ingest vinmonopolet

      - id: cola
        name: Sync TTB COLA approvals (last 8 days)
        if: ${{ inputs.cola_scope != 'full-history' }}
        # Preserve the failure outcome so the final step can report a partial sync.
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/.github/certificates/entrust-ov-tls-issuing-rsa-ca-2.pem
        run: pnpm ingest cola --since "$(date -u -d '8 days ago' +%F)"

      - id: cola-full-history
        name: Backfill full TTB whiskey COLA history
        if: ${{ inputs.cola_scope == 'full-history' }}
        # A full history import partitions capped registry downloads until each
        # is complete. Do not hide a failure: an incomplete seed must be rerun.
        timeout-minutes: 360
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/.github/certificates/entrust-ov-tls-issuing-rsa-ca-2.pem
        run: pnpm ingest cola --full

      - id: enrich
        name: Enrich flavor profiles
        # A full backfill can add a large number of bottles. Seed first, then
        # explicitly dispatch a separate enrichment run when desired.
        # Keep bulk enrichment offline by default: direct Anthropic web search
        # can add one paid search per bottle at this catalog scale.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_enrich != true && inputs.cola_scope != 'full-history' }}
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "OPENROUTER_API_KEY and ANTHROPIC_API_KEY secrets are not set — skipping enrichment."
            exit 0
          fi
          pnpm ingest enrich --no-web

      - name: Report incomplete catalog sync
        if: ${{ always() && (steps.oregon.outcome == 'failure' || steps.utah.outcome == 'failure' || steps.bc.outcome == 'failure' || steps.systembolaget.outcome == 'failure' || steps.whiskyedition.outcome == 'failure' || steps.vinmonopolet.outcome == 'failure' || steps.cola.outcome == 'failure' || steps.cola-full-history.outcome == 'failure' || steps.enrich.outcome == 'failure') }}
        run: |
          echo "## Catalog sync incomplete" >> "$GITHUB_STEP_SUMMARY"
          echo "One or more optional source steps failed after the Iowa import. Read the failed step logs and remediate the source or credential before rerunning." >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Catalog sync completed only partially; inspect the failed source steps."
          exit 1
